<!-- Same script as STAGE_SCALE_SCRIPT in src/design-system/layout/stageScript.ts, so stories scale like the app. -->
<script>
  (function () {
    var d = document.documentElement;
    function s() {
      d.style.setProperty("--stage-scale", String(Math.min(innerWidth / 1440, innerHeight / 900)));
    }
    s();
    addEventListener("resize", s);
  })();
</script>
