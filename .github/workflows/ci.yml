name: CI
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # chromium for the desktop and mobile projects, webkit for the Safari smoke (P10)
      - name: Install browsers (retries on network trouble)
        run: |
          for i in 1 2 3; do
            timeout 10m pnpm exec playwright install --with-deps chromium webkit && exit 0
            echo "browser install failed (try $i of 3)"; sleep 20
          done
          exit 1
      - run: pnpm verify
        env:
          # A reserved test name, so the canonical, sitemap and robots specs have an address to check (P3)
          VITE_SITE_URL: https://arena.example
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
