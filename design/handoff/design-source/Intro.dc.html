<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Introduction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&amp;family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#020304}
a{color:#D7FF3F}a:hover{color:#EBFF9E}
.d{font-family:'Big Shoulders Display','Oswald','Arial Narrow',sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.glass{background:rgba(14,19,26,0.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.10)}

/* ---------- the character rig: 48 rendered frames in three strips ---------- */
.sA{background:url(/_blob/ce44ebfed8ad9979086b96c681c1f133) 0 0/8960px 451px no-repeat}
.sB{background:url(/_blob/ec1dd1224b94231a919a24552cd472bc) 0 0/8960px 451px no-repeat}
.sC{background:url(/_blob/830b24f7277c2c75359b074fc3c52669) 0 0/8960px 451px no-repeat}
.restmask{-webkit-mask-image:url(/_blob/f8a90aea8f1ad9cd7e8273aa370812df);mask-image:url(/_blob/f8a90aea8f1ad9cd7e8273aa370812df);-webkit-mask-size:100% 100%;mask-size:100% 100%}

@keyframes play{from{background-position:0 0}to{background-position:-8400px 0}}
@keyframes on{from,to{opacity:1}}
@keyframes off{from,to{opacity:0}}
.sA{animation:play .667s steps(16,jump-none) forwards 1.85s,off .01s forwards 2.517s}
.sB{opacity:0;animation:play .667s steps(16,jump-none) forwards 2.517s,on .01s forwards 2.517s,off .01s forwards 3.183s}
.sC{opacity:0;animation:play .667s steps(16,jump-none) forwards 3.183s,on .01s forwards 3.183s}

/* entrance: a backlit silhouette swinging in, body turned toward travel */
@keyframes travel{0%{transform:perspective(1300px) translateX(-1180px) rotateY(30deg) scale(.9);filter:blur(10px)}65%{filter:blur(2px)}100%{transform:perspective(1300px) translateX(0) rotateY(0) scale(1);filter:blur(0)}}
@keyframes lit{from{filter:brightness(.07) saturate(.2) drop-shadow(-2px 0 0 #D7FF3F) drop-shadow(0 0 16px rgba(215,255,63,.6))}to{filter:brightness(1) saturate(1) drop-shadow(0 0 0 rgba(215,255,63,0)) drop-shadow(0 0 0 rgba(215,255,63,0))}}
@keyframes impact{0%{clip-path:inset(0 0 0 0);transform:none}20%{clip-path:inset(18% 0 60% 0);transform:translateX(-16px)}40%{clip-path:inset(55% 0 15% 0);transform:translateX(12px)}60%{clip-path:inset(0 0 0 0);transform:translateX(-5px)}80%,100%{clip-path:inset(0 0 0 0);transform:none}}
@keyframes ghost{0%{opacity:.5}70%{opacity:.2}100%{opacity:0}}
@keyframes trail{0%{opacity:0}15%{opacity:1}75%{opacity:.7}100%{opacity:0}}
@keyframes breathe{0%,100%{transform:none}50%{transform:translateY(-2px) scale(1.009)}}
@keyframes sweepface{0%{background-position:150% 0;opacity:0}10%{opacity:1}60%{background-position:-50% 0;opacity:1}61%,100%{opacity:0;background-position:-50% 0}}
@keyframes streak{0%{transform:scaleX(0);opacity:0}30%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1.25);opacity:0}}
@keyframes glint{0%,100%{opacity:0;transform:scale(.3)}35%{opacity:.85;transform:scale(1)}}
@keyframes shock{0%{opacity:0;transform:scaleX(.2)}20%{opacity:1}100%{opacity:0;transform:scaleX(3)}}

.mover{animation:travel .95s cubic-bezier(.12,.9,.25,1) both 0.95s}
.g1{animation:travel .95s cubic-bezier(.12,.9,.25,1) both 1.02s,ghost 1.05s linear both 1.02s}
.g2{animation:travel .95s cubic-bezier(.12,.9,.25,1) both 1.09s,ghost 1.05s linear both 1.09s}
.fig{animation:lit .8s cubic-bezier(.4,0,.2,1) both 1.85s,impact .32s steps(1) both 1.88s}
.trail{animation:trail 1.25s ease-out both .95s}
.breath{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite 3.9s}
.sweep{background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,250,235,.38) 50%,rgba(215,255,63,.18) 54%,rgba(255,255,255,0) 62%) 0 0/300% 100% no-repeat;opacity:0;animation:sweepface 6s ease-in-out infinite 4.3s}
.streak{transform-origin:50% 50%;opacity:0;animation:streak .55s cubic-bezier(.22,1,.36,1) both 2.78s}
.glint{opacity:0;animation:glint .5s ease-out both 2.8s}
.shock{transform-origin:0 50%;opacity:0;animation:shock .6s ease-out both 1.88s}

/* stadium + board */
@keyframes bank{0%,15%{opacity:.04}20%{opacity:1}24%{opacity:.2}30%{opacity:1}100%{opacity:1}}
@keyframes flare{0%,100%{box-shadow:0 0 40px 12px rgba(228,238,252,0.45),0 0 220px 80px rgba(200,216,238,0.14)}30%{box-shadow:0 0 80px 30px rgba(255,255,255,0.9),0 0 420px 180px rgba(220,232,250,0.35)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes boardOn{0%{border-color:#14191F;box-shadow:0 0 0 8px #07090C,0 0 0 9px #11161C,0 50px 140px rgba(0,0,0,.7)}100%{border-color:#2A323C;box-shadow:0 0 0 8px #0A0D11,0 0 0 9px #232A33,0 50px 140px rgba(0,0,0,.7),0 0 120px rgba(215,255,63,0.06)}}
@keyframes boardHit{0%,100%{box-shadow:0 0 0 8px #0A0D11,0 0 0 9px #232A33,0 50px 140px rgba(0,0,0,.7)}25%{box-shadow:0 0 0 8px #0A0D11,0 0 0 9px #D7FF3F,0 50px 140px rgba(0,0,0,.7),0 0 90px rgba(215,255,63,0.45)}}
@keyframes sweep{0%{transform:translateX(-120px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1300px);opacity:0}}
@keyframes absorb{0%{transform:scale(1);opacity:0}18%{opacity:1}100%{transform:scale(.02);opacity:.15}}
@keyframes la{0%{opacity:0;transform:translateY(-60px) scaleY(1.9);filter:blur(12px);color:#D7FF3F}55%{opacity:1;filter:blur(0);color:#D7FF3F;text-shadow:0 0 30px rgba(215,255,63,.9)}70%{transform:translateX(5px)}100%{opacity:1;transform:none;color:#F4F6F7}}
@keyframes lb{0%{opacity:0;transform:translateY(70px) scaleX(1.6);filter:blur(12px);color:#D7FF3F}55%{opacity:1;filter:blur(0);color:#D7FF3F;text-shadow:0 0 30px rgba(215,255,63,.9)}70%{transform:translateX(-5px)}100%{opacity:1;transform:none;color:#F4F6F7}}
@keyframes lc{0%{opacity:0;transform:scale(2.4);filter:blur(16px);color:#D7FF3F}55%{opacity:1;filter:blur(0);color:#D7FF3F;text-shadow:0 0 30px rgba(215,255,63,.9)}100%{opacity:1;transform:none;color:#F4F6F7}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes bar{0%{transform:translateX(0);opacity:1}90%{opacity:1}100%{transform:translateX(560px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0}25%{opacity:.55}100%{opacity:0}}
@keyframes cta{0%,100%{box-shadow:0 0 30px rgba(215,255,63,0.25)}50%{box-shadow:0 0 60px rgba(215,255,63,0.55)}}

.bank{animation:bank 1.1s ease-out both,flare 1s ease-out 5.0s}
.fade{animation:fadein 1s ease-out both}
.board{animation:boardOn .7s ease-out both .8s,boardHit .7s ease-out 1.88s}
.scan{animation:sweep 1s cubic-bezier(.4,0,.2,1) both .95s}
.px{animation:absorb .8s cubic-bezier(.7,0,.84,0) both}
.la{display:inline-block;animation:la .7s cubic-bezier(.22,1,.36,1) both}
.lb{display:inline-block;animation:lb .7s cubic-bezier(.22,1,.36,1) both}
.lc{display:inline-block;animation:lc .7s cubic-bezier(.22,1,.36,1) both}
.wipe{animation:wipe .6s cubic-bezier(.65,0,.35,1) both 3.95s}
.bar{animation:bar .6s cubic-bezier(.65,0,.35,1) both 3.95s}
.rise{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.flash{animation:flash .9s ease-out both 5.0s}
.cta{animation:rise .7s cubic-bezier(.22,1,.36,1) both 5.7s,cta 2.4s ease-in-out 6.5s infinite}
.cta:hover{background:#E6FF7A!important}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important}
  .sA,.sB,.px,.ghost,.trail,.sweep,.streak,.glint,.shock{display:none}
  .sC{opacity:1;background-position:-8400px 0}
}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#020304;font-family:'Archivo','Helvetica Neue',sans-serif;color:#F2F4F5">
<sc-if value="{{on}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;inset:0">

  <!-- night sky, crowd, field -->
  <div class="fade" style="position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at 50% 0%,rgba(150,172,200,0.18),rgba(2,3,4,0) 70%);animation-delay:.9s"></div>
  <div class="fade" style="position:absolute;left:-120px;right:-120px;top:530px;height:300px;border-radius:50% 50% 0 0/60% 60% 0 0;background-image:radial-gradient(rgba(214,224,236,0.30) 1px,transparent 1.7px);background-size:7px 6px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 60%,transparent 95%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 60%,transparent 95%);opacity:.6;animation-delay:.3s"></div>
  <div style="position:absolute;left:0;right:0;top:690px;height:420px;perspective:900px"><div class="fade" style="width:1300px;height:700px;margin:0 auto;border-radius:50%;transform:rotateX(72deg);transform-origin:50% 0;background:radial-gradient(ellipse at 50% 40%,rgba(46,132,78,0.7),rgba(14,52,32,0.5) 45%,rgba(2,3,4,0) 70%);animation-delay:1.2s"></div></div>

  <!-- floodlights -->
  <div class="fade" style="position:absolute;left:40px;top:60px;width:540px;height:800px;background:linear-gradient(180deg,rgba(225,236,250,0.14),rgba(225,236,250,0));clip-path:polygon(18% 0,30% 0,100% 100%,40% 100%);filter:blur(6px);animation-delay:.4s"></div>
  <div class="fade" style="position:absolute;right:40px;top:60px;width:540px;height:800px;background:linear-gradient(180deg,rgba(225,236,250,0.14),rgba(225,236,250,0));clip-path:polygon(70% 0,82% 0,60% 100%,0 100%);filter:blur(6px);animation-delay:.9s"></div>
  <div class="bank" style="position:absolute;left:80px;top:34px;width:112px;height:44px;border-radius:3px;background:radial-gradient(circle,#FFFFFF 0 2.6px,rgba(255,255,255,0) 3.6px) 0 0/12px 11px,#1A2027;box-shadow:0 0 40px 12px rgba(228,238,252,0.45),0 0 220px 80px rgba(200,216,238,0.14);animation-delay:.2s,5.0s"></div>
  <div class="bank" style="position:absolute;left:380px;top:20px;width:84px;height:32px;border-radius:3px;background:radial-gradient(circle,#FFFFFF 0 2.4px,rgba(255,255,255,0) 3.4px) 0 0/12px 11px,#1A2027;box-shadow:0 0 30px 10px rgba(228,238,252,0.40),0 0 160px 60px rgba(200,216,238,0.10);animation-delay:.45s,5.05s"></div>
  <div class="bank" style="position:absolute;right:380px;top:20px;width:84px;height:32px;border-radius:3px;background:radial-gradient(circle,#FFFFFF 0 2.4px,rgba(255,255,255,0) 3.4px) 0 0/12px 11px,#1A2027;box-shadow:0 0 30px 10px rgba(228,238,252,0.40),0 0 160px 60px rgba(200,216,238,0.10);animation-delay:.7s,5.1s"></div>
  <div class="bank" style="position:absolute;right:80px;top:34px;width:112px;height:44px;border-radius:3px;background:radial-gradient(circle,#FFFFFF 0 2.6px,rgba(255,255,255,0) 3.6px) 0 0/12px 11px,#1A2027;box-shadow:0 0 40px 12px rgba(228,238,252,0.45),0 0 220px 80px rgba(200,216,238,0.14);animation-delay:.95s,5.15s"></div>

  <!-- THE SCOREBOARD -->
  <div class="board" style="position:absolute;left:100px;top:96px;width:1240px;height:540px;background:#06080B radial-gradient(rgba(255,255,255,0.045) 1px,rgba(255,255,255,0) 1.4px) 0 0/4px 4px;border:1px solid #2A323C;overflow:hidden">

    <div class="m fade" style="position:absolute;left:0;right:0;top:0;height:48px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1A2028;background:#06080B;font-size:12px;letter-spacing:.22em;color:#A3ADB7;animation-delay:.85s;z-index:5">
      <span style="display:flex;align-items:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:#FF4D3D"></span>LIVE · PLAYER INTRODUCTION</span>
      <span>THE ARENA · MATCHDAY</span>
    </div>

    <!-- warm backlight that the silhouette is cut against -->
    <div class="fade" style="position:absolute;right:-40px;bottom:30px;width:700px;height:520px;background:radial-gradient(ellipse 45% 50% at 50% 55%,rgba(255,150,60,0.22),rgba(255,150,60,0.06) 45%,rgba(6,8,11,0) 70%);animation-delay:1.5s"></div>

    <!-- LED scan bar leading the entrance -->
    <div class="scan" style="position:absolute;top:48px;bottom:64px;left:0;width:90px;background:linear-gradient(90deg,rgba(215,255,63,0),rgba(215,255,63,0.24),rgba(215,255,63,0));opacity:0;z-index:2"></div>

    <!-- ghost silhouettes (motion trail) -->
    <div class="g1 ghost" style="position:absolute;right:36px;bottom:64px;width:560px;height:451px;opacity:0;z-index:1"><div class="sA" style="width:560px;height:451px;animation:none;filter:brightness(.35) sepia(1) saturate(6) hue-rotate(28deg)"></div></div>
    <div class="g2 ghost" style="position:absolute;right:36px;bottom:64px;width:560px;height:451px;opacity:0;z-index:1"><div class="sA" style="width:560px;height:451px;animation:none;filter:brightness(.25) sepia(1) saturate(5) hue-rotate(-10deg)"></div></div>

    <!-- impact shockwave where he lands -->
    <div class="shock" style="position:absolute;right:560px;top:48px;bottom:64px;width:6px;background:linear-gradient(180deg,rgba(215,255,63,0),#D7FF3F,rgba(215,255,63,0));box-shadow:0 0 30px #D7FF3F;z-index:2"></div>

    <!-- THE CHARACTER -->
    <div class="mover" style="position:absolute;right:36px;bottom:64px;width:560px;height:451px;z-index:3">
      <div class="trail" style="position:absolute;left:-600px;top:0;width:680px;height:451px;opacity:0;pointer-events:none">
        <span style="position:absolute;right:0;top:120px;width:660px;height:3px;background:linear-gradient(90deg,rgba(215,255,63,0),#D7FF3F);box-shadow:0 0 14px #D7FF3F"></span>
        <span style="position:absolute;right:30px;top:178px;width:500px;height:2px;background:linear-gradient(90deg,rgba(255,170,90,0),#FFB25C)"></span>
        <span style="position:absolute;right:0;top:250px;width:600px;height:6px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.7));filter:blur(2px)"></span>
        <span style="position:absolute;right:40px;top:330px;width:420px;height:2px;background:linear-gradient(90deg,rgba(215,255,63,0),rgba(215,255,63,0.8))"></span>
        <span style="position:absolute;right:20px;top:395px;width:520px;height:3px;background:linear-gradient(90deg,rgba(255,170,90,0),rgba(255,170,90,0.7))"></span>
        <span style="position:absolute;right:70px;top:96px;width:6px;height:6px;background:#D7FF3F;box-shadow:0 0 10px #D7FF3F"></span>
        <span style="position:absolute;right:190px;top:156px;width:4px;height:4px;background:#FFFFFF"></span>
        <span style="position:absolute;right:130px;top:286px;width:5px;height:5px;background:#FFB25C"></span>
        <span style="position:absolute;right:310px;top:216px;width:4px;height:4px;background:#D7FF3F"></span>
        <span style="position:absolute;right:440px;top:136px;width:3px;height:3px;background:#FFFFFF"></span>
        <span style="position:absolute;right:260px;top:350px;width:4px;height:4px;background:#D7FF3F"></span>
      </div>

      <div class="fig" style="position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%)">
        <div class="breath" style="position:absolute;inset:0">
          <div class="sA" role="img" aria-label="Yash Sarda" style="position:absolute;inset:0"></div>
          <div class="sB" aria-hidden="true" style="position:absolute;inset:0"></div>
          <div class="sC" aria-hidden="true" style="position:absolute;inset:0"></div>
          <div class="sweep restmask" aria-hidden="true" style="position:absolute;inset:0"></div>
        </div>
      </div>

      <!-- the look: anamorphic flare across the eye line -->
      <div class="streak" style="position:absolute;left:60px;top:165px;width:460px;height:2px;background:linear-gradient(90deg,rgba(215,255,63,0),rgba(255,255,255,0.95) 45%,rgba(255,255,255,0.95) 55%,rgba(215,255,63,0));box-shadow:0 0 12px rgba(215,255,63,0.8);z-index:2"></div>
      <div class="glint" style="position:absolute;left:244px;top:160px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#FFFFFF,rgba(255,255,255,0) 70%);z-index:2"></div>
      <div class="glint" style="position:absolute;left:314px;top:160px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#FFFFFF,rgba(255,255,255,0) 70%);z-index:2"></div>

      <!-- LED pixel grid + scanlines so he lives IN the board -->
      <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(6,8,11,0) 1.1px,rgba(6,8,11,0.5) 1.7px);background-size:4px 4px;pointer-events:none;z-index:3"></div>
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.16) 0 1px,rgba(0,0,0,0) 1px 3px);-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 40%,transparent 80%);mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 40%,transparent 80%);pointer-events:none;z-index:3"></div>
    </div>

    <!-- pixels flying into the name -->
    <sc-for list="{{pixels}}" as="p" hint-placeholder-count="0">
      <span class="px" style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;width:0;height:0;transform-origin:0 0;animation-delay:{{p.delay}}s;z-index:4">
        <span style="position:absolute;left:{{p.dx}}px;top:{{p.dy}}px;width:{{p.s}}px;height:{{p.s}}px;background:{{p.c}};box-shadow:0 0 6px {{p.c}}"></span>
      </span>
    </sc-for>

    <!-- name -->
    <div style="position:absolute;left:56px;top:150px;display:flex;flex-direction:column;gap:18px;z-index:4">
      <h1 class="d" aria-label="Yash Sarda" style="margin:0;font-size:132px;line-height:.85;font-weight:900;letter-spacing:.02em;color:#F4F6F7;text-shadow:0 0 24px rgba(255,255,255,0.30);white-space:nowrap">
        <sc-for list="{{letters}}" as="l" hint-placeholder-count="10"><span class="{{l.cls}}" aria-hidden="true" style="animation-delay:{{l.delay}}s;min-width:{{l.w}}">{{l.ch}}</span></sc-for>
      </h1>
      <div style="position:relative;height:38px">
        <span class="d wipe" style="display:block;font-size:34px;font-weight:700;letter-spacing:.40em;color:#D7FF3F;text-shadow:0 0 18px rgba(215,255,63,0.45);white-space:nowrap">SOFTWARE ENGINEER</span>
        <span class="bar" style="position:absolute;left:0;top:-4px;width:4px;height:46px;background:#F4F6F7;box-shadow:0 0 16px #D7FF3F;opacity:0"></span>
      </div>
      <div class="m" style="display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.22em;color:#C3CBD3">
        <span class="rise" style="animation-delay:4.3s;color:#F2F4F5">PLAYER 01</span>
        <span class="rise" style="animation-delay:4.36s;color:#D7FF3F">•</span>
        <span class="rise" style="animation-delay:4.42s">ENGINEER</span>
        <span class="rise" style="animation-delay:4.48s;color:#D7FF3F">•</span>
        <span class="rise" style="animation-delay:4.54s">BUILDER</span>
        <span class="rise" style="animation-delay:4.6s;color:#D7FF3F">•</span>
        <span class="rise" style="animation-delay:4.66s">COMPETITOR</span>
      </div>
    </div>

    <!-- bottom strip -->
    <div class="fade" style="position:absolute;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #1A2028;background:#06080B;animation-delay:4.6s;z-index:5">
      <div style="display:flex;align-items:center;gap:14px;padding:0 28px"><span class="m" style="font-size:11px;letter-spacing:.2em;color:#7D8893">INTRODUCING</span><span class="d" style="font-size:22px;font-weight:800;letter-spacing:.08em">NO. 01</span></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;border-left:1px solid #1A2028;border-right:1px solid #1A2028"><span class="m" style="font-size:11px;letter-spacing:.2em;color:#7D8893">RECORD</span><span class="d" style="font-size:22px;font-weight:800;letter-spacing:.08em">99 – 1</span></div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 28px"><span class="m" style="font-size:11px;letter-spacing:.2em;color:#7D8893">STATUS</span><span class="d" style="font-size:22px;font-weight:800;letter-spacing:.08em;color:#D7FF3F">UNDEFEATED</span></div>
    </div>
  </div>

  <!-- whole-stadium flash -->

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  componentWillUnmount() {
    clearTimeout(this.t);
  }
  renderVals() {
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const colors = ['#D7FF3F', '#D7FF3F', '#F4F6F7', '#FFB25C'];
    const pixels = Array.from({ length: 90 }, () => {
      const x = Math.round(60 + rnd() * 560);
      const y = Math.round(162 + rnd() * 100);
      const dx = Math.round(-420 + rnd() * 1100);
      const dy = Math.round(-150 + rnd() * 380);
      return { x, y, dx, dy, s: rnd() > 0.7 ? 5 : 3, c: colors[Math.floor(rnd() * colors.length)], delay: (2.85 + rnd() * 0.5).toFixed(2) };
    });
    const word = 'YASH SARDA'.split('');
    const order = [3, 0, 7, 5, 1, 9, 2, 8, 6, 4];
    const kinds = ['la', 'lb', 'lc'];
    const letters = word.map((ch, i) => ({
      ch: ch === ' ' ? ' ' : ch,
      cls: kinds[i % 3],
      w: ch === ' ' ? '0.28em' : 'auto',
      delay: (3.1 + order[i] * 0.055).toFixed(3)
    }));
    return {
      on: this.state.on,
      pixels,
      letters,
      replay: () => {
        clearTimeout(this.t);
        this.setState({ on: false });
        this.t = setTimeout(() => this.setState({ on: true }), 80);
      }
    };
  }
}
</script>
